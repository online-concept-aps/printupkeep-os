name: Build image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CUSTOM_PI_OS_REF: "2.0.0"
  BASE_BOARD: raspberrypiarm64
  # Pinned Raspberry Pi OS Lite arm64 (Debian 13 "Trixie") base image.
  BASE_IMAGE_URL: "https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz"
  BASE_IMAGE_SHA256: "acff736ca7945e3b305f07cda4abdb870910e12634991da69783611756e381b3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils p7zip-full qemu-user-static \
            python3-git python3-yaml xz-utils

      - name: Checkout CustomPiOS (pinned)
        uses: actions/checkout@v4
        with:
          repository: guysoft/CustomPiOS
          ref: ${{ env.CUSTOM_PI_OS_REF }}
          path: CustomPiOS

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: repository

      - name: Read connector version
        id: connector
        run: |
          source repository/src/modules/printupkeep/config
          echo "version=${PRINTUPKEEP_CONNECTOR_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download connector tarball (pre-chroot injection)
        # The chroot has no GitHub credentials, and the release lives on a
        # private repo. Fetching it here with the workflow token and dropping
        # it into the module's filesystem/ means the chroot script installs
        # from a local file and needs no network/auth inside the chroot.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.connector.outputs.version }}"
          DEST=repository/src/modules/printupkeep/filesystem/connector
          gh release download "connector-v${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern "printupkeep-connector-*" \
            --dir "$DEST"
          ls -la "$DEST"
          ( cd "$DEST" && sha256sum -c "printupkeep-connector-${VERSION}.tgz.sha256" )

      - name: Download base image (pinned)
        run: |
          mkdir -p "repository/src/image-${BASE_BOARD}"
          cd "repository/src/image-${BASE_BOARD}"
          wget -q --tries=3 "${BASE_IMAGE_URL}"
          echo "${BASE_IMAGE_SHA256}  $(basename "${BASE_IMAGE_URL}")" | sha256sum -c -

      - name: Update CustomPiOS paths
        run: |
          cd repository/src
          ../../CustomPiOS/src/update-custompios-paths

      - name: Build image
        run: |
          sudo modprobe loop
          cd repository/src
          sudo BASE_BOARD="${BASE_BOARD}" bash -x ./build_dist

      - name: Verify image contents (imager_custom assertion)
        run: |
          set -x
          VERSION="${{ steps.connector.outputs.version }}"
          IMG=$(ls repository/src/workspace/*.img | head -n 1)
          test -n "$IMG"
          LOOP=$(sudo losetup -fP --show "$IMG")
          mkdir -p rootfs-mnt
          sudo mount -o ro "${LOOP}p2" rootfs-mnt

          # Raspberry Pi Imager hostname/Wi-Fi/SSH customization must keep working
          if sudo test ! -f rootfs-mnt/usr/lib/raspberrypi-sys-mods/imager_custom; then
            echo "::error::imager_custom missing from the built rootfs — Raspberry Pi Imager customization would be broken"
            sudo umount rootfs-mnt; sudo losetup -d "$LOOP"; exit 1
          fi

          # PrintUpkeep bits landed where they should (note: 'current' is an
          # absolute symlink, so resolve it manually instead of following it)
          sudo test -x rootfs-mnt/opt/node/bin/node
          sudo test -f "rootfs-mnt/opt/printupkeep/versions/${VERSION}/dist/cli.js"
          test "$(sudo readlink rootfs-mnt/opt/printupkeep/current)" = "/opt/printupkeep/versions/${VERSION}"
          sudo test -f rootfs-mnt/etc/systemd/system/printupkeep-connector.service
          # enable-symlinks are absolute, so check link existence (-L), not the
          # target (-f would resolve against the HOST filesystem)
          sudo test -L rootfs-mnt/etc/systemd/system/multi-user.target.wants/printupkeep-connector.service
          sudo test -L rootfs-mnt/etc/systemd/system/multi-user.target.wants/printupkeep-firstboot.service
          sudo test -L rootfs-mnt/etc/systemd/system/multi-user.target.wants/printupkeep-control.path
          # sudo is impossible under NoNewPrivileges — the control path unit
          # replaced the sudoers whitelist, which must be GONE.
          sudo test ! -e rootfs-mnt/etc/sudoers.d/printupkeep
          sudo test -f rootfs-mnt/etc/systemd/system/printupkeep-control.service
          sudo test -f rootfs-mnt/etc/avahi/services/http.service
          sudo test -x rootfs-mnt/opt/printupkeep/update.sh
          sudo test -x rootfs-mnt/opt/printupkeep/control.sh

          sudo umount rootfs-mnt
          sudo losetup -d "$LOOP"
          echo "All rootfs assertions passed"

      - name: Package (rename, compress, checksums)
        id: package
        run: |
          set -x
          source repository/src/config
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${DIST_VERSION}"
          fi
          IMAGE="printupkeep-os-${VERSION}-arm64"
          # workspace is root-owned (the build runs under sudo)
          sudo mv repository/src/workspace/*.img "${IMAGE}.img"
          sudo chown "$(id -u):$(id -g)" "${IMAGE}.img"
          sha256sum "${IMAGE}.img" > checksums.txt
          xz -9 -T0 "${IMAGE}.img"
          sha256sum "${IMAGE}.img.xz" >> checksums.txt
          cat checksums.txt
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.image }}
          path: |
            ${{ steps.package.outputs.image }}.img.xz
            checksums.txt

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # TODO(release): after this step, fill in rpi-imager/rpi-imager.json
        # for the new release before any Raspberry Pi Imager submission:
        #   url                    -> the release's .img.xz download URL
        #   image_download_sha256  -> sha256 of the .img.xz   (in checksums.txt)
        #   extract_sha256         -> sha256 of the raw .img  (in checksums.txt)
        #   image_download_size    -> byte size of the .img.xz
        #   extract_size           -> byte size of the raw .img
        #   release_date           -> YYYY-MM-DD
        # This stays manual while the repo is private; automate it (jq into the
        # JSON + commit, or attach a generated rpi-imager.json to the release)
        # once the repo goes public.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --title "PrintUpkeep OS ${GITHUB_REF_NAME}" \
            --notes "PrintUpkeep OS ${GITHUB_REF_NAME} (arm64, Raspberry Pi OS Lite / Debian 13). Flash with Raspberry Pi Imager — see docs/FLASHING.md." \
            "${{ steps.package.outputs.image }}.img.xz" \
            checksums.txt
